services:
  rustfs:
    image: rustfs/rustfs:latest
    command: ["--address", ":9000", "--console-enable", "/data"]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    # The web UI fetches presigned xorb URLs straight from RustFS on a
    # different origin, with a Range header (which triggers a CORS preflight),
    # so the bucket needs a CORS policy. Origins are open ("*") because
    # presigned URLs are self-authenticating; restrict AllowedOrigins to the
    # UI's origin for production. ExposeHeaders covers what the download path
    # reads from the response.
    entrypoint:
      - /bin/sh
      - -c
      - |
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
          echo 'waiting for rustfs...'; sleep 2;
        done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://openxet || true
        aws --endpoint-url http://rustfs:9000 s3api put-bucket-cors --bucket openxet --cors-configuration '{
          "CORSRules": [{
            "AllowedOrigins": ["*"],
            "AllowedMethods": ["GET", "HEAD"],
            "AllowedHeaders": ["*"],
            "ExposeHeaders": ["Content-Range", "Content-Length", "ETag"],
            "MaxAgeSeconds": 3600
          }]
        }'
        echo 'bucket ready (CORS configured)'

  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openxet
      POSTGRES_PASSWORD: openxet
      POSTGRES_DB: openxet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openxet -d openxet"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  openxet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - openxet-data:/.data
    environment:
      OPENXET_HOST: "0.0.0.0"
      OPENXET_PORT: "8080"
      OPENXET_DATA_DIR: /.data
      # Local demo runs without auth; production should configure OIDC
      # (OPENXET_OIDC_ISSUERS) instead.
      OPENXET_AUTH_ENABLED: "false"
      OPENXET_STORAGE_BACKEND: s3
      OPENXET_S3_BUCKET: openxet
      OPENXET_S3_REGION: us-east-1
      OPENXET_S3_ENDPOINT: http://rustfs:9000
      # The server reaches rustfs over the internal docker network, but
      # presigned download URLs are handed to external clients that can't
      # resolve `rustfs`. Sign those URLs against the externally reachable
      # host instead. Override for your deployment (e.g. localhost).
      OPENXET_S3_PUBLIC_ENDPOINT: ${OPENXET_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      OPENXET_S3_ACCESS_KEY_ID: rustfsadmin
      OPENXET_S3_SECRET_ACCESS_KEY: rustfsadmin
      OPENXET_S3_ALLOW_HTTP: "true"
      # Shared index so the server can scale to multiple replicas; tables are
      # created on startup.
      OPENXET_INDEX_BACKEND: postgres
      OPENXET_POSTGRES_URL: postgres://openxet:openxet@postgres:5432/openxet
    healthcheck:
      # /v1/shards answers 405 to GET; any HTTP response means the server is up
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/v1/shards"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

# Docker-managed named volumes (not host bind mounts): the container users
# (postgres uid 70, rustfs, the server) own the data inside the volume, so no
# root-owned dirs land in the working tree. Wipe all state with
# `docker compose -f docker/compose.rustfs.yaml down -v`.
volumes:
  rustfs-data:
  pgdata:
  openxet-data:
