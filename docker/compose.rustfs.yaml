services:
  rustfs:
    image: rustfs/rustfs:latest
    command: ["--address", ":9000", "--console-enable", "/data"]
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do
        echo 'waiting for rustfs...'; sleep 2;
      done;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://openxet || true;
      echo 'bucket ready';
      exit 0;
      "

  openxet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - .data:/.data
    environment:
      OPENXET_HOST: "0.0.0.0"
      OPENXET_PORT: "8080"
      OPENXET_DATA_DIR: /.data
      OPENXET_AUTH_SECRET: change-me-in-production
      OPENXET_STORAGE_BACKEND: s3
      OPENXET_S3_BUCKET: openxet
      OPENXET_S3_REGION: us-east-1
      OPENXET_S3_ENDPOINT: http://rustfs:9000
      OPENXET_S3_ACCESS_KEY_ID: rustfsadmin
      OPENXET_S3_SECRET_ACCESS_KEY: rustfsadmin
      OPENXET_S3_ALLOW_HTTP: "true"
    healthcheck:
      # /v1/shards answers 405 to GET; any HTTP response means the server is up
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/v1/shards"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  rustfs-data:
