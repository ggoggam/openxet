[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ggoggam/openxet"

[workspace.dependencies]
# HuggingFace xet-core crates. These are published as packaging for hf-xet
# with no semver promise, so they are pinned exactly; upgrade deliberately
# alongside hf_xet releases and re-run the compat test suite.
#
# NOTE: Cargo.lock pins the transitive `tracing-appender` at 0.2.4 (matching
# xet-core's own lockfile) — 0.2.5 fails to compile for wasm32, which breaks
# the openxet-wasm build. Re-pin after any `cargo update` that bumps it.
xet-core-structures = "=1.5.2"
xet-data = "=1.5.2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bytes
bytes = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Hex encoding
hex = "0.4"

# Internal crates
openxet-cas-types = { path = "crates/cas_types" }
