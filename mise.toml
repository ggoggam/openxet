[env]
HF_XET_ENDPOINT="http://localhost:8080"

# Rust itself is expected via rustup (see README); everything else is
# provisioned by `mise install`.
[tools]
bun = "latest"
uv = "latest"
prek = "latest"
"github:rustwasm/wasm-pack" = "latest"
"cargo:cargo-nextest" = "latest"

[tasks."pre-commit"]
description = "Run pre-commit checks via prek"
run = "prek run --show-diff-on-failure --color=always --all-files --hook-stage=manual"

# ── Docker ─────────────────────────────────────────────────────────────────────

[tasks."docker:up"]
description = "Bring up docker compose services"
run = "docker compose -f docker/compose.rustfs.yaml up -d --build --force-recreate --remove-orphans"
alias = "up"

[tasks."docker:down"]
description = "bring down docker compose services"
run = "docker compose -f docker/compose.rustfs.yaml down --remove-orphans"
alias = "down"

[tasks."docker:log"]
description = "View docker logs"
run = "docker compose -f docker/compose.rustfs.yaml logs --tail 100"
alias = "log"

[tasks."gitea:up"]
description = "Bring up the gitea + openxet + rustfs stack"
run = "docker compose -f docker/compose.gitea.yaml up -d --build --force-recreate --remove-orphans"

[tasks."gitea:down"]
description = "Bring down the gitea stack (add -- -v to drop volumes)"
run = "docker compose -f docker/compose.gitea.yaml down --remove-orphans"

[tasks."gitea:log"]
description = "View gitea stack logs"
run = "docker compose -f docker/compose.gitea.yaml logs --tail 100"

# ── Build ─────────────────────────────────────────────────────────────────────

[tasks."build"]
description = "Build all crates (debug)"
run = "cargo build"
sources = ["Cargo.toml", "crates/**/Cargo.toml", "crates/**/*.rs"]

[tasks."build:release"]
description = "Build all crates (release)"
run = "cargo build --release"
sources = ["Cargo.toml", "crates/**/Cargo.toml", "crates/**/*.rs"]

# ── Test ──────────────────────────────────────────────────────────────────────

[tasks.test]
description = "Run all tests"
run = "cargo nextest run test"
env = { RUST_BACKTRACE = "1" }

[tasks."test:unit"]
description = "Run unit tests only"
run = "cargo nextest run test --lib"

[tasks."test:integration"]
description = "Run integration tests only"
run = "cargo nextest run test --test '*'"
env = { RUST_BACKTRACE = "1" }

# ── Lint & Format ─────────────────────────────────────────────────────────────

[tasks.lint]
description = "Run clippy on all crates"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.check]
description = "Run fmt check, clippy, and tests"
depends = ["fmt:check", "lint", "test"]

# ── Frontend ──────────────────────────────────────────────────────────────────

[tasks."fe:install"]
description = "Install frontend dependencies"
run = "bun install"
dir = "web"

[tasks."fe:wasm"]
description = "Build the openxet-wasm package used by the upload page"
run = [
  "rustup target add wasm32-unknown-unknown",
  "wasm-pack build crates/wasm --target web --release --out-dir {{config_root}}/web/src/lib/openxet-wasm",
]
sources = [
  "Cargo.lock",
  "crates/wasm/**/*",
  "crates/chunking/**/*",
  "crates/hashing/**/*",
  "crates/cas_types/**/*",
]
outputs = ["web/src/lib/openxet-wasm/openxet_wasm_bg.wasm"]

[tasks."fe:build"]
description = "Build frontend for production"
depends = ["fe:install", "fe:wasm"]
sources = [
  "src/**/*",
  "index.html",
  "package.json",
  "bun.lock",
  "vite.config.ts",
  "tsconfig*.json",
]
outputs = ["dist/index.html"]
run = "bun run build"
dir = "web"

[tasks."fe:dev"]
description = "Run the frontend dev server (proxies /v1 to localhost:8080)"
depends = ["fe:install", "fe:wasm"]
run = "bun run dev"
dir = "web"

[tasks."fe:lint"]
description = "Lint frontend code"
depends = ["fe:install"]
run = "bun run lint"
dir = "web"

# ── Run ───────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Run the server in debug mode"
depends = ["build", "fe:build"]
run = "cargo run --bin openxet-server"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"
