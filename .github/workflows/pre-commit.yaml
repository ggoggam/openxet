name: Pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'Cargo.lock') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - run: pre-commit run --all-files
