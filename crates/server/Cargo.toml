[package]
name = "openxet-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "openxet-server"
path = "src/main.rs"

[dependencies]
openxet-cas-types = { workspace = true }
xet-core-structures = { workspace = true }
tokio = { version = "1", features = ["full"] }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "limit"] }
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
rand = "0.8"
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
url = "2"
futures = "0.3"
rocksdb = "0.24.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }

[dev-dependencies]
xet-data = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
