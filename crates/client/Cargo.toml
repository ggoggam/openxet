[package]
name = "openxet-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "openxet-client"
path = "src/main.rs"

[dependencies]
openxet-hashing = { workspace = true }
openxet-chunking = { workspace = true }
openxet-cas-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
jsonwebtoken = "9"
